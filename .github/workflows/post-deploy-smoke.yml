name: Post-deploy smoke

# Triggered after Vercel reports a successful deployment.
# If smoke is red, the deploy is reverted via Vercel's promotion workflow.
on:
  deployment_status:

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run smoke against live URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: pnpm --filter web exec playwright test --project=smoke
      - name: Trigger revert if smoke red
        if: failure()
        run: |
          echo "::error::Live smoke red; rolling back via Vercel."
          curl -X POST "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/promote/previous" \
               -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}"
